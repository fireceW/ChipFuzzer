# Put it in /etc/nginx/conf.d/chipfuzzer-api.conf (example)
# Goal: reverse https://your-server-host/api/* to local 127.0.0.1:8088/api/*

server {
  listen 80;
  server_name your-server-host;

  # If you already have HTTPS/certificate/existing site, please merge the following location into your server block

  location /api/ {
    proxy_pass http://127.0.0.1:8088/api/;
    proxy_http_version 1.1;

    # SSE Key: Don’t cache, don’t buffer
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-cache";

    # Timeout settings: genhtml can take a long time
    proxy_connect_timeout 60s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;

    # Transparent transmission of information
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
